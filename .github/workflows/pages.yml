name: Publier le jeu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier la syntaxe et les règles
        run: |
          npm run check
          npm test
      - name: Préparer les seuls fichiers du jeu
        run: |
          mkdir _site
          cp index.html style.css game.js api.js app.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
